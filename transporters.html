<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transporter Directory — Guwahati</title>
<style>
:root {
  --ink: #0f1117;
  --paper: #f5f0e8;
  --cream: #ede7d9;
  --rust: #c4451a;
  --rust-light: #f5ece8;
  --rust-mid: #e07250;
  --gold: #c89b3c;
  --gold-light: #fdf6e3;
  --teal: #1a6b5a;
  --teal-light: #e8f5f1;
  --border: #d4cfc4;
  --text2: #5a5248;
  --text3: #9a9490;
  --shadow: 0 4px 24px rgba(15,17,23,0.10);
  --shadow-lg: 0 12px 48px rgba(15,17,23,0.16);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: var(--ink);
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 3px solid var(--rust);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  gap: 16px;
}
.logo-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.logo-icon {
  width: 38px; height: 38px;
  background: var(--rust);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.logo-text {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-weight: 800;
  font-size: 18px;
  color: white;
  letter-spacing: -0.3px;
  line-height: 1.1;
}
.logo-sub { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 400; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; letter-spacing: 0.3px; }
.header-count {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-family: ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  white-space: nowrap;
}

/* ── HERO SEARCH ── */
.hero {
  background: var(--ink);
  padding: 40px 24px 56px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(196,69,26,0.18) 0%, transparent 70%);
  pointer-events: none;
}
.hero-label {
  font-family: ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  font-size: 11px;
  color: var(--rust-mid);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hero-title {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 800;
  color: white;
  line-height: 1.1;
  margin-bottom: 8px;
  letter-spacing: -1px;
}
.hero-title span { color: var(--rust-mid); }
.hero-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 32px;
}

/* ── SEARCH BOX ── */
.search-wrap {
  max-width: 620px;
  margin: 0 auto 20px;
  position: relative;
}
.search-icon-wrap {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  pointer-events: none;
  z-index: 2;
}
.search-input {
  width: 100%;
  padding: 18px 18px 18px 54px;
  font-size: 16px;
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-weight: 600;
  border: 2.5px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  background: rgba(255,255,255,0.06);
  color: white;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  backdrop-filter: blur(8px);
}
.search-input::placeholder { color: rgba(255,255,255,0.3); font-weight: 400; }
.search-input:focus {
  border-color: var(--rust);
  background: rgba(255,255,255,0.10);
}
.search-clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.12);
  border: none;
  color: rgba(255,255,255,0.6);
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: none;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.search-clear.show { display: flex; }
.search-clear:hover { background: rgba(255,255,255,0.2); }

/* ── QUICK LOCATION PILLS ── */
.quick-locations {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 720px;
  margin: 0 auto;
}
.ql-pill {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.65);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  white-space: nowrap;
}
.ql-pill:hover, .ql-pill.active {
  background: var(--rust);
  border-color: var(--rust);
  color: white;
}

/* ── MAIN CONTENT ── */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

/* ── RESULTS BAR ── */
.results-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.results-count {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
}
.results-count span { color: var(--rust); }
.results-hint { font-size: 12px; color: var(--text3); }
.view-toggle { display: flex; gap: 6px; }
.vt-btn {
  background: var(--cream);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.vt-btn.active {
  background: var(--ink);
  border-color: var(--ink);
  color: white;
}

/* ── GRID VIEW ── */
.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.list-view { display: flex; flex-direction: column; gap: 10px; }

/* ── CARD ── */
.card {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
  cursor: default;
  animation: fadeUp 0.25s ease both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.card:hover { box-shadow: var(--shadow); border-color: var(--rust-mid); transform: translateY(-2px); }

.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-num {
  font-family: ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--text3);
  background: var(--cream);
  border-radius: 5px;
  padding: 2px 7px;
  flex-shrink: 0;
  margin-top: 2px;
}
.card-name {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
  flex: 1;
}
.card-name mark {
  background: #fde68a;
  color: var(--ink);
  border-radius: 3px;
  padding: 0 1px;
}

.card-gst {
  font-family: ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  font-size: 10.5px;
  color: var(--text2);
  background: var(--cream);
  border-radius: 6px;
  padding: 4px 9px;
  margin-bottom: 10px;
  display: inline-block;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}
.card-gst:hover { background: var(--gold-light); }
.copy-tooltip {
  position: absolute;
  bottom: calc(100% + 5px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: white;
  font-size: 10px;
  border-radius: 5px;
  padding: 3px 8px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.card-gst:hover .copy-tooltip { opacity: 1; }

.card-contact {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 11px;
  flex-wrap: wrap;
}
.contact-icon { font-size: 13px; flex-shrink: 0; }
.contact-numbers {
  font-size: 12.5px;
  color: var(--ink);
  font-weight: 600;
  line-height: 1.4;
}
.contact-numbers a {
  color: var(--teal);
  text-decoration: none;
}
.contact-numbers a:hover { text-decoration: underline; }

.card-divider { height: 1px; background: var(--border); margin-bottom: 10px; }

.card-stations-label {
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text3);
  margin-bottom: 6px;
}
.stations-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.station-tag {
  background: var(--teal-light);
  color: var(--teal);
  border: 1px solid #b8dfda;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
}
.station-tag:hover {
  background: var(--teal);
  color: white;
  border-color: var(--teal);
}
.station-tag.highlight {
  background: var(--rust);
  color: white;
  border-color: var(--rust);
}
.station-tag mark {
  background: transparent;
  color: white;
}

/* ── LIST VIEW CARD ── */
.list-view .card {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  gap: 12px;
  align-items: center;
  padding: 14px 18px;
}
.list-view .card-main { min-width: 0; }
.list-view .card-name { font-size: 13px; margin-bottom: 2px; }
.list-view .card-gst { margin-bottom: 0; }
.list-view .card-contact { margin-bottom: 0; }
.list-view .card-divider { display: none; }
.list-view .stations-section { grid-column: 1 / -1; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
.list-view .card-head { margin-bottom: 0; }

/* ── EMPTY STATE ── */
.empty {
  text-align: center;
  padding: 80px 24px;
  color: var(--text3);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size: 20px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.empty-sub { font-size: 14px; }

/* ── STATS STRIP ── */
.stats-strip {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-chip {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.stat-chip:hover, .stat-chip.active {
  background: var(--rust-light);
  border-color: var(--rust-mid);
  color: var(--rust);
}

/* ── COPY TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink);
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  z-index: 999;
  transition: transform 0.3s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .grid-view { grid-template-columns: 1fr; }
  .list-view .card { grid-template-columns: 1fr; }
  .header-count { display: none; }
  .hero { padding: 28px 16px 40px; }
}
</style>
</head>

<div class="main">

const QUICK_LOCS = ["JORHAT","DIMAPUR","SILCHAR","TINSUKIA","DIBRUGARH","IMPHAL","NAHARLAGUN","TEZPUR","SHILLONG","AIZAWL","NAGAON","AGARTALA"];

let currentQuery = '';
let currentView = 'grid';

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, query) {
  if(!query) return esc(text);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

function buildCard(t, query) {
  const stationsHtml = t.stations.map(s => {
    const isMatch = query && s.toUpperCase().includes(query.toUpperCase());
    const label = query ? highlight(s, query) : esc(s);
    return `<span class="station-tag${isMatch?' highlight':''}" onclick="searchLocation('${s}')">${label}</span>`;
  }).join('');

  const numbers = t.contact.split('/').map(n => {
    const clean = n.trim().replace(/[^0-9]/g,'');
    return `<a href="tel:${clean}">${n.trim()}</a>`;
  }).join(' / ');

  return `<div class="card" style="animation-delay:${Math.random()*0.08}s">
    <div class="card-head">
      <div class="card-name">${highlight(t.name, query)}</div>
      <div class="card-num">#${t.id}</div>
    </div>
    <div class="card-gst" onclick="copyGST('${t.gst}')" title="Click to copy GST">
      ${esc(t.gst)}
      <span class="copy-tooltip">Copy GST</span>
    </div>
    <div class="card-contact">
      <span class="contact-icon">📞</span>
      <span class="contact-numbers">${numbers}</span>
    </div>
    <div class="card-divider"></div>
    <div class="card-stations-label">Delivers to</div>
    <div class="stations-wrap">${stationsHtml}</div>
  </div>`;
}

function render(query) {
  const q = query.trim();
  const container = document.getElementById('cardsContainer');
  const countEl = document.getElementById('resultsCount');

  let filtered = TRANSPORTERS;
  if(q) {
    const qUp = q.toUpperCase();
    filtered = TRANSPORTERS.filter(t =>
      t.name.toUpperCase().includes(qUp) ||
      t.gst.toUpperCase().includes(qUp) ||
      t.stations.some(s => s.toUpperCase().includes(qUp)) ||
      t.contact.includes(q)
    );
  }

  if(filtered.length === 0) {
    container.innerHTML = `<div class="empty">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">No transporters found</div>
      <div class="empty-sub">Try searching for "${esc(q)}" differently, or browse all locations below</div>
    </div>`;
    countEl.innerHTML = `<span>0</span> results for "${esc(q)}"`;
    return;
  }

  countEl.innerHTML = q
    ? `<span>${filtered.length}</span> transporter${filtered.length!==1?'s':''} for "<span>${esc(q)}</span>"`
    : `All <span>${filtered.length}</span> Transporters`;

  container.innerHTML = filtered.map(t => buildCard(t, q)).join('');
}

function searchLocation(loc) {
  const input = document.getElementById('searchInput');
  input.value = loc;
  currentQuery = loc;
  document.getElementById('clearBtn').classList.add('show');
  updateQuickPills(loc);
  render(loc);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  currentQuery = '';
  document.getElementById('clearBtn').classList.remove('show');
  updateQuickPills('');
  render('');
}

function updateQuickPills(active) {
  document.querySelectorAll('.ql-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.loc.toUpperCase() === active.toUpperCase());
  });
}

function setView(v) {
  currentView = v;
  const container = document.getElementById('cardsContainer');
  container.className = v === 'grid' ? 'grid-view' : 'list-view';
  document.getElementById('gridBtn').classList.toggle('active', v === 'grid');
  document.getElementById('listBtn').classList.toggle('active', v === 'list');
}

function copyGST(gst) {
  navigator.clipboard.writeText(gst).then(() => {
    const t = document.getElementById('toast');
    t.textContent = `✓ GST copied: ${gst}`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }).catch(() => {
    const t = document.getElementById('toast');
    t.textContent = gst;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}

// ── INIT ──
// Build quick location pills
const qlContainer = document.getElementById('quickLocations');
QUICK_LOCS.forEach(loc => {
  const btn = document.createElement('button');
  btn.className = 'ql-pill';
  btn.dataset.loc = loc;
  btn.textContent = loc;
  btn.onclick = () => {
    if(btn.classList.contains('active')) {
      clearSearch();
    } else {
      searchLocation(loc);
    }
  };
  qlContainer.appendChild(btn);
});

// Search input handler
const searchInput = document.getElementById('searchInput');
let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const val = searchInput.value;
  document.getElementById('clearBtn').classList.toggle('show', val.length > 0);
  updateQuickPills(val);
  debounceTimer = setTimeout(() => {
    currentQuery = val;
    render(val);
  }, 180);
});

searchInput.addEventListener('keydown', e => {
  if(e.key === 'Escape') clearSearch();
});

// Initial render
render('');
